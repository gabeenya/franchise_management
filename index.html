<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>거래 강제 품목 1step 관리 시스템</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --bg:#F7F8FA; --surface:#FFFFFF; --surface2:#F2F4F7; --ink:#1A1D23; --muted:#5F6673; --line:#E3E6EB;
  --accent:#E8590C; --accent-ink:#FFFFFF; --accent-soft:#FFF4EC; --accent-strong:#C2410C; --danger:#D92D20; --danger-bg:#FEF3F2; --warn:#B54708; --warn-bg:#FFFAEB;
  --ok:#039855; --gauge:#E4E7EC;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-weight:700;font-size:17px;padding:0 10px 14px;letter-spacing:-.01em}
.logo-img{display:block;width:170px;max-width:100%;height:auto;margin:2px auto 16px}
.logo small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer}
.nav-btn:hover{background:var(--surface2)}
.nav-btn[aria-current="true"]{background:var(--surface2);font-weight:600}
.swatch{width:6px;align-self:stretch;min-height:22px;border-radius:3px;flex:none}
.nav-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-count{font-size:12px;color:var(--muted)}
.dot{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--danger);color:#fff;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.nav-sep{height:1px;background:var(--line);margin:8px 6px}
.side-add{margin-top:6px;border:1px dashed var(--line);background:transparent;padding:9px;border-radius:8px;cursor:pointer;color:var(--muted)}
.side-add:hover{color:var(--ink);border-color:var(--muted)}

main{padding:28px 32px 60px;min-width:0;max-width:1320px}
.brand-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:18px;position:relative}
.brand-head::before{content:"";position:absolute;left:0;top:-28px;width:72px;height:6px;background:var(--brand,var(--accent));border-radius:0 0 3px 3px}
h1{font-size:30px;line-height:1.2;margin:0;letter-spacing:-.02em;font-weight:700}
.head-meta{color:var(--muted);font-size:14px;display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.head-meta b{color:var(--ink);font-weight:600}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link-btn{border:0;background:none;color:var(--accent);cursor:pointer;padding:2px 4px;font-weight:500}

.tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--brand,var(--accent));font-weight:600}

.alert{border:1px solid var(--danger);background:var(--danger-bg);border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:flex-start}
.alert strong{color:var(--danger)}
.alert ul{margin:4px 0 0;padding-left:18px}
.alert.info{border-color:var(--line);background:var(--surface2)}
.alert-icon{font-size:18px;line-height:1.3}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px}
.kpi{background:var(--surface);padding:14px 16px}
.kpi-label{font-size:13px;color:var(--muted)}
.kpi-val{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi-val.bad{color:var(--danger)}
.kpi-sub{font-size:12px;color:var(--muted)}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.search{flex:1;min-width:180px;max-width:320px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px}
.check{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:1280px}
.basis-cell{max-width:240px;font-size:13.5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:keep-all}
.method{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
th{font-size:12.5px;font-weight:600;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
th.num{text-align:right}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover td{background:var(--surface2)}
tr.over td{background:var(--danger-bg)}
tr.over:hover td{background:var(--danger-bg)!important}
tr.released td{color:var(--muted)}
tfoot td{font-weight:600;background:var(--surface2);border-top:1px solid var(--line);border-bottom:0}
.item-name{font-weight:600}
.item-sub{font-size:12.5px;color:var(--muted)}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);margin-left:6px;font-weight:500;vertical-align:1px}
.tag.bad{border-color:var(--danger);color:var(--danger)}
.tag.warn{border-color:var(--warn);color:var(--warn)}

.gauge{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.gauge-track{position:relative;width:96px;height:8px;background:var(--gauge);border-radius:4px}
.gauge-fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ok)}
.gauge-fill.near{background:var(--warn)}
.gauge-fill.over{background:var(--danger)}
.gauge-tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.rate{font-weight:600;min-width:50px;text-align:right;font-variant-numeric:tabular-nums}
.rate.over{color:var(--danger)} .rate.near{color:var(--warn)}

.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 12px}

.section-h{display:flex;align-items:center;gap:10px;margin:8px 0 10px}
.section-h h2{font-size:17px;margin:0}
.section-h p{margin:0;color:var(--muted);font-size:13px}
.doc-list{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:28px}
.doc{display:flex;gap:14px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.doc:last-child{border-bottom:0}
.doc-icon{width:38px;height:46px;border:1px solid var(--line);border-radius:4px;display:flex;align-items:flex-end;justify-content:center;font-size:10px;font-weight:700;color:var(--muted);padding-bottom:5px;flex:none;background:var(--surface2)}
.doc-main{flex:1;min-width:200px}
.doc-title{font-weight:600}
.doc-meta{font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.doc-actions{display:flex;gap:6px}

dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog.wide{width:min(960px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(10,16,20,.45)}
.dlg-head{padding:18px 22px 0;display:flex;align-items:center;gap:10px}
.dlg-head h3{margin:0;font-size:18px;flex:1}
.dlg-body{padding:16px 22px;overflow:auto}
.dlg-foot{padding:14px 22px 18px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%}
.field textarea{min-height:64px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted)}
.preview-calc{grid-column:1/-1;background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:14px;display:flex;gap:18px;flex-wrap:wrap}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.swatches button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.viewer{width:100%;height:70vh;border:1px solid var(--line);border-radius:8px;background:#fff}
.viewer-img{max-width:100%;display:block;margin:0 auto}
pre.viewer-text{white-space:pre-wrap;font-size:13px;max-height:70vh;overflow:auto;background:var(--surface2);padding:12px;border-radius:8px;margin:0}

.login{max-width:380px;margin:48px auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px}
.login h1{font-size:24px;margin-bottom:6px}
.login .field{margin-bottom:12px}
.user-box{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center;min-width:0}
#userEmail{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.logged-out #addBrand, body.logged-out #userBox{display:none}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
#toast.show{opacity:1}
.loading{padding:60px;text-align:center;color:var(--muted)}

@media (max-width:860px){
  .app{grid-template-columns:1fr;min-height:0}
  .side{background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;overflow-x:auto;padding:10px;gap:4px;border-right:0;border-bottom:1px solid var(--line);z-index:5;align-items:center}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .logo{display:none}
  #brandNav{display:flex;gap:4px}
  .nav-btn{width:auto;white-space:nowrap}
  .nav-sep{display:none}
  .side-add{margin:0;white-space:nowrap}
  main{padding:28px 16px 48px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
  h1{font-size:25px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="브랜드 목록">
    <div class="logo"><img class="logo-img" src="assets/elandeats-logo.png" alt="이랜드이츠" width="252" height="63">거래 강제 품목<br>1step 관리 시스템<small>가맹본부 필수품목 관리</small></div>
    <nav id="brandNav"></nav>
    <button class="side-add" id="addBrand" type="button">+ 브랜드 추가</button>
    <div class="user-box" id="userBox"><span id="userEmail"></span><button class="link-btn" id="logoutBtn" type="button">로그아웃</button></div>
  </aside>
  <main id="main"><div class="loading">데이터를 불러오는 중…</div></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script>
(function(){
const S = {brands:[], items:[], atts:[], view:'overview', tab:'items', q:'', showReleased:false,
  canWrite:true, db:null, assets:null, downloads:null, loaded:{b:false,i:false,a:false}, dbFailed:false};
const COLORS = ['#1F5F7A','#B5473A','#2F7D4F','#8A5A1E','#5B4B9A','#A33A6B','#2E6E8E','#6B7A2A','#C07A12','#3D4E5C'];
const COMMON = '_common';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => isFinite(n) ? Math.round(n).toLocaleString('ko-KR') : '–';
const pct = n => isFinite(n) ? n.toFixed(1) + '%' : '–';
const today = () => new Date().toISOString().slice(0,10);
const fmtSize = b => !b ? '' : b > 1048576 ? (b/1048576).toFixed(1)+'MB' : Math.max(1,Math.round(b/1024))+'KB';

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2600); }

/* ---------- calc ---------- */
function threshOf(it, b){ return (it.threshold !== undefined && it.threshold !== null && it.threshold !== '') ? +it.threshold : (+b?.threshold || 0); }
function calc(it, b){
  const th = threshOf(it,b);
  if(it.cost === null || it.cost === undefined || it.cost === '') return {m:NaN, rate:NaN, th, status:'nocost', monthly:0, supTotal:0};
  const cost=+it.cost||0, sup=+it.supply||0, qty=+it.qty||0;
  const m = sup - cost, rate = sup > 0 ? m/sup*100 : NaN;
  const status = !isFinite(rate) ? 'none' : rate > th ? 'over' : rate >= th - 3 ? 'near' : 'ok';
  return {m, rate, th, status, monthly:m*qty, supTotal:sup*qty};
}
function brandStats(b){
  const its = S.items.filter(i => i.brandId === b.id && !i.releasedAt);
  let m=0, s=0, near=0, nocost=0; const over=[];
  its.forEach(i => { const c=calc(i,b); m+=c.monthly; s+=c.supTotal; if(c.status==='over') over.push({i,c}); if(c.status==='near') near++; if(c.status==='nocost') nocost++; });
  const avg=+b.avgSales||0, bench=(b.benchmark===undefined||b.benchmark===null||b.benchmark==='')?NaN:+b.benchmark;
  const salesRatio = avg>0 ? m*12/avg*100 : NaN;
  const salesStatus = (!isFinite(salesRatio)||!isFinite(bench)) ? 'none' : salesRatio>bench ? 'over' : salesRatio>=bench*0.9 ? 'near' : 'ok';
  return {count:its.length, monthly:m, wavg: s>0 ? m/s*100 : NaN, over, near, total: m*(+b.storeCount||0), supply:s, salesRatio, bench, salesStatus, annual:m*12, nocost};
}
const brandById = id => S.brands.find(b => b.id === id);

/* ---------- write helpers ---------- */
async function guard(fn, okMsg){
  if(!S.canWrite){ toast('이 계정은 보기 전용입니다.'); return false; }
  try{ await fn(); if(okMsg) toast(okMsg); return true; }
  catch(e){
    if(e && e.code === 'invalid_argument'){ S.canWrite=false; toast('저장 권한이 없습니다. 보기 전용으로 전환합니다.'); render(); }
    else if(e && e.code === 'quota_exceeded') toast('저장 공간이 가득 찼습니다.');
    else toast('저장하지 못했습니다. 잠시 후 다시 시도하세요.');
    console.error(e); return false;
  }
}

/* ---------- routing ---------- */
function go(view){ S.view=view; S.q=''; try{ history.replaceState(null,'','#'+view); }catch(e){} render(); window.scrollTo(0,0); }
function readHash(){ const h=(location.hash||'').slice(1); if(h) S.view=h; }

/* ---------- render ---------- */
function render(){
  renderNav();
  if(S.dbFailed){ $('#main').innerHTML = '<div class="empty"><p>데이터 저장소에 연결할 수 없습니다.</p><p class="hint">claude.ai에 로그인한 상태에서 이 페이지를 열어 주세요.</p></div>'; return; }
  if(!(S.loaded.b && S.loaded.i && S.loaded.a)){ return; }
  const b = brandById(S.view);
  if(!b){ S.view='overview'; renderOverview(); } else renderBrand(b);
  $('#addBrand').hidden = !S.canWrite;
}

function renderNav(){
  const items = S.brands.map(b => {
    const st = brandStats(b);
    return `<button class="nav-btn" data-go="${esc(b.id)}" aria-current="${S.view===b.id}">
      <span class="swatch" style="background:${esc(b.color||COLORS[0])}"></span>
      <span class="nav-name">${esc(b.name)}</span>
      ${(st.over.length + (st.salesStatus==='over'?1:0)) ? `<span class="dot" title="기준 초과 알림">${st.over.length + (st.salesStatus==='over'?1:0)}</span>` : `<span class="nav-count">${st.count}</span>`}
    </button>`;
  }).join('');
  $('#brandNav').innerHTML = `<button class="nav-btn" data-go="overview" aria-current="${S.view==='overview'}"><span class="swatch" style="background:var(--muted)"></span><span class="nav-name">전체 현황</span></button><div class="nav-sep"></div>` + items;
}

function renderOverview(){
  const rows = S.brands.map(b => ({b, st:brandStats(b)}));
  const totalOver = rows.reduce((a,r)=>a+r.st.over.length+(r.st.salesStatus==='over'?1:0),0);
  document.documentElement.style.removeProperty('--brand');
  $('#main').innerHTML = `
    <div class="brand-head"><div><h1>전체 브랜드 현황</h1>
      <div class="head-meta"><span>브랜드 <b>${S.brands.length}</b>개</span><span>지정 품목 <b>${rows.reduce((a,r)=>a+r.st.count,0)}</b>개</span><span>기준 초과 <b style="color:${totalOver?'var(--danger)':'inherit'}">${totalOver}</b>개</span></div></div></div>
    ${S.brands.length ? `
    <div class="table-wrap"><table style="min-width:860px">
      <thead><tr><th>브랜드</th><th class="num">지정 품목</th><th class="num">매출 대비 차액가맹금율</th><th class="num">업종 기준</th><th class="num">점포당 월 마진</th><th class="num">가맹점 수</th><th class="num">브랜드 전체 월 추정</th><th class="num">알림</th></tr></thead>
      <tbody>${rows.map(({b,st}) => `<tr class="clickable${(st.over.length||st.salesStatus==='over')?' over':''}" data-go="${esc(b.id)}">
        <td><span class="item-name"><span class="swatch" style="display:inline-block;height:14px;width:5px;vertical-align:-2px;margin-right:8px;background:${esc(b.color)}"></span>${esc(b.name)}</span></td>
        <td class="num">${st.count}</td><td class="num"><span class="rate ${st.salesStatus}">${pct(st.salesRatio)}</span></td><td class="num">${pct(st.bench)}</td>
        <td class="num">${won(st.monthly)}원</td><td class="num">${(+b.storeCount||0).toLocaleString('ko-KR')}</td>
        <td class="num">${won(st.total)}원</td>
        <td class="num">${st.salesStatus==='over'?'<span class="tag bad">업종 기준 초과</span>':''}${st.over.length?`<span class="tag bad">품목 ${st.over.length}개 초과</span>`:''}${(!st.over.length&&st.salesStatus!=='over')?((st.near||st.salesStatus==='near')?'<span class="tag warn">근접</span>':'<span class="hint">없음</span>'):''}</td></tr>`).join('')}
      </tbody></table></div>
    <p class="hint" style="margin-top:10px">매출 대비 차액가맹금율 = (점포당 월 마진 × 12) ÷ 가맹점 평균 연매출. 업종 기준은 공정거래위원회 「2025년 가맹사업 현황」(2026. 4. 12. 발표, 2024년 말 정보공개서 기준)의 업종별 ‘가맹점 평균 매출액 대비 평균 차액가맹금 비율’이며, 법정 상한이 아닌 업계 평균 비교 지표입니다. 마진 = 공급가 − 매입가, VAT 별도.</p>`
    : `<div class="empty"><p>등록된 브랜드가 없습니다.</p>${S.canWrite?'<button class="btn primary" data-act="brand-new">브랜드 추가</button>':''}</div>`}`;
}

function renderBrand(b){
  document.documentElement.style.setProperty('--brand', b.color || COLORS[0]);
  const st = brandStats(b);
  const itemCount = S.items.filter(i=>i.brandId===b.id).length;
  const attCount = S.atts.filter(a=>a.brandId===b.id||a.brandId===COMMON).length;
  $('#main').innerHTML = `
    <div class="brand-head">
      <div><h1>${esc(b.name)}</h1>
        <div class="head-meta"><span>가맹점 <b>${(+b.storeCount||0).toLocaleString('ko-KR')}</b>개</span><span>업종 기준 차액가맹금율 <b>${pct(+b.benchmark)}</b></span><span>품목 마진율 기준 <b>${pct(+b.threshold)}</b></span>${b.manager?`<span>담당 <b>${esc(b.manager)}</b></span>`:''}</div>${b.benchmarkSource?`<div class="hint" style="margin-top:4px">기준 출처: ${esc(b.benchmarkSource)}</div>`:''}</div>
      <span class="spacer"></span>
      ${S.canWrite?`<button class="btn" data-act="brand-edit" data-id="${esc(b.id)}">브랜드 설정</button>`:''}
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="items" aria-selected="${S.tab==='items'}">필수품목 (${itemCount})</button>
      <button class="tab" role="tab" data-tab="docs" aria-selected="${S.tab==='docs'}">별첨 서류 (${attCount})</button>
    </div>
    <div id="tabBody"></div>`;
  if(S.tab==='docs') renderDocs(b); else renderItems(b, st);
}

function renderItems(b, st){
  let its = S.items.filter(i => i.brandId === b.id && (S.showReleased || !i.releasedAt));
  const q = S.q.trim().toLowerCase();
  if(q) its = its.filter(i => [i.name,i.spec,i.category,i.supplier,i.supplyMethod,i.basis].join(' ').toLowerCase().includes(q));
  its.sort((x,y) => { const rx=calc(x,b).rate, ry=calc(y,b).rate; return (!!x.releasedAt - !!y.releasedAt) || ((isFinite(ry)?1:0)-(isFinite(rx)?1:0)) || ((isFinite(rx)&&isFinite(ry)) ? ry-rx : 0) || ((+x.no||9999)-(+y.no||9999)) || String(x.name).localeCompare(String(y.name)); });
  const hasSample = S.items.some(i => i.brandId===b.id && i.sample);
  const maxScale = Math.max(40, (+b.threshold||0)*2, ...its.map(i=>calc(i,b).rate).filter(isFinite));
  const gauge = (c) => {
    if(c.status==='nocost') return '<span class="tag warn">매입가 미입력</span>';
    if(!isFinite(c.rate)) return '<span class="hint">–</span>';
    const w = Math.max(0, Math.min(100, c.rate/maxScale*100)), t = Math.min(100, c.th/maxScale*100);
    return `<div class="gauge" title="기준 ${pct(c.th)}"><div class="gauge-track"><div class="gauge-fill ${c.status}" style="width:${w}%"></div><div class="gauge-tick" style="left:calc(${t}% - 1px)"></div></div><span class="rate ${c.status}">${pct(c.rate)}</span></div>`;
  };
  const rowsHtml = its.map(i => { const c = calc(i,b); return `
    <tr class="clickable ${i.releasedAt?'released':(c.status==='over'?'over':'')}" data-act="item-edit" data-id="${esc(i.id)}">
      <td><div class="item-name">${esc(i.name)}${i.sample?'<span class="tag">예시</span>':''}${i.releasedAt?'<span class="tag">지정 해제</span>':''}${c.status==='over'&&!i.releasedAt?'<span class="tag bad">기준 초과</span>':''}</div><div class="item-sub">${esc(i.category||'')}</div></td>
      <td><div>${esc(i.spec||'–')}</div><div class="item-sub">${esc(i.unit||'')}</div></td>
      <td>${esc(i.supplier||'–')}</td>
      <td>${i.supplyMethod?`<span class="method">${esc(i.supplyMethod)}</span>`:'<span class="tag warn">미지정</span>'}</td>
      <td><div class="basis-cell" title="${esc(i.basis||'')}">${esc(i.basis||'–')}</div></td>
      <td class="num">${c.status==='nocost'?'<span class="hint">미입력</span>':won(+i.cost)}</td>
      <td class="num">${(i.supply===null||i.supply===undefined||i.supply==='')?'<span class="hint">미입력</span>':won(+i.supply)}</td>
      <td class="num">${won(c.m)}</td>
      <td>${gauge(c)}</td>
      <td class="num">${(+i.qty||0).toLocaleString('ko-KR')}</td>
      <td class="num">${c.status==='nocost'?'–':won(c.monthly)}</td>
      <td class="num">${esc(i.designatedAt||'–')}${i.releasedAt?`<div class="item-sub">해제 ${esc(i.releasedAt)}</div>`:''}</td>
    </tr>`; }).join('');
  $('#tabBody').innerHTML = `
    ${st.salesStatus==='over' ? `<div class="alert" role="alert"><span class="alert-icon">🚨</span><div><strong>매출 대비 차액가맹금율 ${pct(st.salesRatio)}: 업종 기준 ${pct(st.bench)}보다 ${(st.salesRatio-st.bench).toFixed(1)}%p 높습니다</strong><div class="hint">점포당 연 차액가맹금 ${won(st.annual)}원 ÷ 가맹점 평균 연매출 ${won(+b.avgSales)}원</div></div></div>` : ''}
    ${!(+b.avgSales>0) ? `<div class="alert info"><span class="alert-icon">ℹ️</span><div style="flex:1">가맹점 평균 연매출을 입력하면 매출 대비 차액가맹금율을 업종 기준(${pct(st.bench)})과 비교합니다.</div>${S.canWrite?`<button class="btn sm" data-act="brand-edit" data-id="${esc(b.id)}">연매출 입력</button>`:''}</div>` : ''}
    ${st.over.length ? `<div class="alert" role="alert"><span class="alert-icon">⚠️</span><div><strong>품목 마진율 기준 초과 품목 ${st.over.length}개</strong>
      <ul>${st.over.map(({i,c})=>`<li>${esc(i.name)}: 마진율 ${pct(c.rate)} (기준 ${pct(c.th)}, ${(c.rate-c.th).toFixed(1)}%p 초과)</li>`).join('')}</ul></div></div>` : ''}
    ${st.nocost ? `<div class="alert info"><span class="alert-icon">ℹ️</span><div style="flex:1">본부 매입가가 없는 품목이 ${st.nocost}개 있습니다. 이 품목들은 마진과 차액가맹금율 계산에서 빠져 있어요. 품목을 눌러 매입가를 입력하세요.</div></div>` : ''}
    ${hasSample ? `<div class="alert info"><span class="alert-icon">ℹ️</span><div style="flex:1">예시 품목이 들어 있습니다. 실제 품목을 등록한 뒤 예시를 지우세요.</div>${S.canWrite?`<button class="btn sm" data-act="clear-sample" data-id="${esc(b.id)}">예시 삭제</button>`:''}</div>` : ''}
    <div class="kpis">
      <div class="kpi"><div class="kpi-label">지정 품목</div><div class="kpi-val">${st.count}개</div><div class="kpi-sub">근접 ${st.near}개</div></div>
      <div class="kpi"><div class="kpi-label">매출 대비 차액가맹금율</div><div class="kpi-val ${st.salesStatus==='over'?'bad':''}">${pct(st.salesRatio)}</div><div class="kpi-sub">업종 기준 ${pct(st.bench)}</div></div>
      <div class="kpi"><div class="kpi-label">가중평균 마진율</div><div class="kpi-val">${pct(st.wavg)}</div><div class="kpi-sub">공급가 대비, 월 구입량 가중</div></div>
      <div class="kpi"><div class="kpi-label">점포당 월 총마진</div><div class="kpi-val">${won(st.monthly)}원</div><div class="kpi-sub">월 공급액 ${won(st.supply)}원</div></div>
      <div class="kpi"><div class="kpi-label">브랜드 전체 월 추정</div><div class="kpi-val">${won(st.total)}원</div><div class="kpi-sub">가맹점 ${(+b.storeCount||0).toLocaleString('ko-KR')}개 기준</div></div>
    </div>
    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="품목명, 규격, 공급업체 검색" value="${esc(S.q)}" aria-label="품목 검색">
      <label class="check"><input type="checkbox" id="showReleased" ${S.showReleased?'checked':''}> 지정 해제 품목 보기</label>
      <span class="spacer"></span>
      ${S.downloads?`<button class="btn" data-act="csv" data-id="${esc(b.id)}">CSV 내보내기</button>`:''}
      ${S.canWrite?`<button class="btn primary" data-act="item-new" data-id="${esc(b.id)}">품목 추가</button>`:''}
    </div>
    ${its.length ? `<div class="table-wrap"><table>
      <thead><tr><th>품목</th><th>규격 / 단위</th><th>공급업체</th><th>공급방식</th><th>공급가격 결정기준</th><th class="num">매입가</th><th class="num">공급가</th><th class="num">마진</th><th class="num">마진율 (｜기준선)</th><th class="num">점포당 월 구입량</th><th class="num">점포당 월 마진</th><th class="num">지정일</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
      <tfoot><tr><td colspan="10">합계 (지정 중인 품목${q?', 검색 결과 제외 전 기준':''})</td><td class="num">${won(st.monthly)}</td><td></td></tr></tfoot>
    </table></div>
    <p class="hint" style="margin-top:8px">금액 단위: 원, VAT 별도. 행을 누르면 상세 정보와 지정 사유를 수정할 수 있습니다.</p>`
    : `<div class="table-wrap"><div class="empty"><p>${q?'검색 결과가 없습니다.':'아직 등록된 필수품목이 없습니다.'}</p>${!q&&S.canWrite?`<button class="btn primary" data-act="item-new" data-id="${esc(b.id)}">첫 품목 추가</button>`:''}</div></div>`}`;
  const s = $('#search');
  if(renderItems._focus){ s.focus(); s.setSelectionRange(s.value.length, s.value.length); renderItems._focus=false; }
}

function docIcon(a){ if(a.link) return 'LINK'; const t=a.contentType||''; if(t.includes('pdf')) return 'PDF'; if(t.startsWith('image/')) return 'IMG'; if(t.includes('csv')) return 'CSV'; if(/sheet|excel/.test(t)) return 'XLS'; if(/word/.test(t)) return 'DOC'; if(/hwp/.test(t)||/\.hwpx?$/i.test(a.fileName||'')) return 'HWP'; if(t.startsWith('text/')) return 'TXT'; return 'FILE'; }
function docActions(a){
  const btns=[];
  if(a.link) btns.push(`<a class="btn sm" href="${esc(a.link)}" target="_blank" rel="noopener noreferrer">열기</a>`);
  if(a.assetId){ btns.push(`<button class="btn sm" data-act="doc-view" data-id="${esc(a.id)}">보기</button>`); if(S.downloads) btns.push(`<button class="btn sm" data-act="doc-dl" data-id="${esc(a.id)}">내려받기</button>`); }
  if(S.canWrite){ btns.push(`<button class="btn sm" data-act="doc-edit" data-id="${esc(a.id)}">수정</button>`); }
  return btns.join('');
}
function renderDocs(b){
  const disc = S.atts.filter(a => a.brandId===b.id && a.kind==='disclosure').sort((x,y)=>String(y.regDate||'').localeCompare(String(x.regDate||'')));
  const forms = S.atts.filter(a => (a.brandId===b.id || a.brandId===COMMON) && a.kind==='form').sort((x,y)=>String(x.category||'').localeCompare(String(y.category||''))||String(x.title).localeCompare(String(y.title)));
  $('#tabBody').innerHTML = `
    <div class="section-h"><h2>정보공개서</h2><p>등록·변경등록 이력별로 보관합니다. 가장 최근 등록본이 맨 위에 표시됩니다.</p><span class="spacer"></span>${S.canWrite?`<button class="btn primary sm" data-act="doc-new" data-kind="disclosure" data-id="${esc(b.id)}">정보공개서 등록</button>`:''}</div>
    <div class="doc-list">${disc.length ? disc.map((a,idx) => `<div class="doc"><div class="doc-icon">${docIcon(a)}</div>
      <div class="doc-main"><div class="doc-title">${esc(a.title)}${idx===0?'<span class="tag">최신</span>':''}</div>
      <div class="doc-meta">${a.regNo?`<span>등록번호 ${esc(a.regNo)}</span>`:''}${a.regDate?`<span>등록일 ${esc(a.regDate)}</span>`:''}${a.fileName?`<span>${esc(a.fileName)} ${fmtSize(a.size)}</span>`:''}${a.note?`<span>${esc(a.note)}</span>`:''}</div></div>
      <div class="doc-actions">${docActions(a)}</div></div>`).join('') : `<div class="empty"><p>등록된 정보공개서가 없습니다.</p></div>`}</div>
    <div class="section-h"><h2>기타 양식</h2><p>계약서, 공급가 산정 근거, 공문 양식 등. 공통 양식은 모든 브랜드에 함께 표시됩니다.</p><span class="spacer"></span>${S.canWrite?`<button class="btn primary sm" data-act="doc-new" data-kind="form" data-id="${esc(b.id)}">양식 추가</button>`:''}</div>
    <div class="doc-list">${forms.length ? forms.map(a => `<div class="doc"><div class="doc-icon">${docIcon(a)}</div>
      <div class="doc-main"><div class="doc-title">${esc(a.title)}${a.brandId===COMMON?'<span class="tag">공통</span>':''}</div>
      <div class="doc-meta">${a.category?`<span>${esc(a.category)}</span>`:''}${a.fileName?`<span>${esc(a.fileName)} ${fmtSize(a.size)}</span>`:''}${a.link?'<span>외부 링크</span>':''}${a.note?`<span>${esc(a.note)}</span>`:''}</div></div>
      <div class="doc-actions">${docActions(a)}</div></div>`).join('') : `<div class="empty"><p>등록된 양식이 없습니다.</p></div>`}</div>`;
}

/* ---------- dialogs ---------- */
const dlg = $('#dlg');
function openDlg(html, wide){ dlg.className = wide?'wide':''; dlg.innerHTML = html; dlg.showModal(); const f=dlg.querySelector('input:not([type=hidden]):not([type=checkbox]):not([type=file]),select,textarea'); if(f) f.focus(); }
function closeDlg(){ dlg.close(); dlg.innerHTML=''; }
dlg.addEventListener('click', e => { if(e.target===dlg) closeDlg(); });
function askConfirm(msg, okLabel){
  return new Promise(res => {
    openDlg(`<div class="dlg-head"><h3>확인</h3></div><div class="dlg-body"><p style="margin:0">${esc(msg)}</p></div>
      <div class="dlg-foot"><button class="btn" data-c="0">취소</button><button class="btn primary" data-c="1">${esc(okLabel||'확인')}</button></div>`);
    dlg.querySelectorAll('[data-c]').forEach(x => x.onclick = () => { closeDlg(); res(x.dataset.c==='1'); });
  });
}
const val = id => (dlg.querySelector('#'+id)?.value ?? '').trim();
const numVal = id => { const v = val(id).replace(/,/g,''); return v===''?null:+v; };

function brandDialog(b){
  let color = b?.color || COLORS[S.brands.length % COLORS.length];
  openDlg(`<div class="dlg-head"><h3>${b?'브랜드 설정':'브랜드 추가'}</h3></div>
  <div class="dlg-body"><div class="grid2">
    <div class="field full"><label for="f-name">브랜드명</label><input id="f-name" value="${esc(b?.name||'')}" required></div>
    <div class="field"><label for="f-bench">업종 기준 차액가맹금율 (%)</label><input id="f-bench" type="number" step="0.1" min="0" value="${esc(b?.benchmark ?? '')}"><span class="hint">가맹점 매출 대비. 넘으면 브랜드 알림</span></div>
    <div class="field"><label for="f-avg">가맹점 평균 연매출 (원)</label><input id="f-avg" inputmode="numeric" value="${esc(b?.avgSales || '')}" placeholder="정보공개서 기재 금액"></div>
    <div class="field full"><label for="f-src">업종 기준 출처</label><input id="f-src" value="${esc(b?.benchmarkSource||'')}"></div>
    <div class="field"><label for="f-th">품목 마진율 알림 기준 (%)</label><input id="f-th" type="number" step="0.1" min="0" value="${esc(b?.threshold ?? 15)}"><span class="hint">품목별 공급가 대비 마진율 (내부 설정)</span></div>
    <div class="field"><label for="f-stores">가맹점 수</label><input id="f-stores" type="number" min="0" value="${esc(b?.storeCount ?? 0)}"></div>
    <div class="field full"><label for="f-mgr">담당자 (선택)</label><input id="f-mgr" value="${esc(b?.manager||'')}"></div>
    <div class="field full"><label>표시 색상</label><div class="swatches">${COLORS.map(c=>`<button type="button" data-color="${c}" style="background:${c}" aria-label="색상 ${c}" aria-pressed="${c===color}"></button>`).join('')}</div></div>
  </div></div>
  <div class="dlg-foot">${b?'<button class="btn danger" id="d-del" style="margin-right:auto">브랜드 삭제</button>':''}<button class="btn" id="d-cancel">취소</button><button class="btn primary" id="d-save">${b?'변경 저장':'브랜드 추가'}</button></div>`);
  dlg.querySelectorAll('[data-color]').forEach(x => x.onclick = () => { color=x.dataset.color; dlg.querySelectorAll('[data-color]').forEach(y=>y.setAttribute('aria-pressed', y===x)); });
  $('#d-cancel').onclick = closeDlg;
  $('#d-save').onclick = async () => {
    const name = val('f-name'); if(!name){ toast('브랜드명을 입력하세요.'); return; }
    const data = {name, benchmark: numVal('f-bench'), avgSales: numVal('f-avg') ?? 0, benchmarkSource: val('f-src'), threshold: numVal('f-th') ?? 0, storeCount: numVal('f-stores') ?? 0, manager: val('f-mgr'), color, updatedAt: new Date().toISOString()};
    let newId;
    const ok = await guard(async () => {
      if(b) await S.db.doc('brands/'+b.id).update(data);
      else { const ref = S.db.collection('brands').doc(); newId = ref.id; await ref.set({...data, order: S.brands.length, createdAt: data.updatedAt}); }
    }, b?'저장했습니다.':'브랜드를 추가했습니다.');
    if(ok){ closeDlg(); if(newId){ S.tab='items'; go(newId); } }
  };
  if(b) $('#d-del').onclick = async () => {
    const n = S.items.filter(i=>i.brandId===b.id).length, d = S.atts.filter(a=>a.brandId===b.id).length;
    if(!await askConfirm(`${b.name} 브랜드와 품목 ${n}개, 별첨 서류 ${d}개를 모두 삭제합니다. 되돌릴 수 없습니다.`, '삭제')) return;
    const ok = await guard(async () => {
      for(const i of S.items.filter(i=>i.brandId===b.id)) await S.db.doc('items/'+i.id).delete();
      for(const a of S.atts.filter(a=>a.brandId===b.id)){ if(a.assetId && S.assets){ try{ await S.assets.delete(a.assetId); }catch(e){} } await S.db.doc('attachments/'+a.id).delete(); }
      await S.db.doc('brands/'+b.id).delete();
    }, '브랜드를 삭제했습니다.');
    if(ok) go('overview');
  };
}

function itemDialog(brandId, it){
  const b = brandById(brandId);
  openDlg(`<div class="dlg-head"><h3>${it?'필수품목 수정':'필수품목 추가'}</h3><span class="hint">${esc(b?.name||'')}</span></div>
  <div class="dlg-body"><div class="grid2">

    : `<div class="field full"><label>첨부 방식</label><div class="seg">${S.assets?`<button type="button" data-mode="file" aria-pressed="${mode==='file'}">파일 업로드</button>`:''}<button type="button" data-mode="link" aria-pressed="${mode==='link'}">링크 등록</button></div></div>

  </div></div>
  <div class="dlg-foot">${a?'<button class="btn danger" id="d-del" style="margin-right:auto">삭제</button>':''}<button class="btn" id="d-cancel">취소</button><button class="btn primary" id="d-save">${a?'변경 저장':'등록'}</button></div>`);
  dlg.querySelectorAll('[data-mode]').forEach(x => x.onclick = () => { mode=x.dataset.mode; dlg.querySelectorAll('[data-mode]').forEach(y=>y.setAttribute('aria-pressed', y===x)); $('#w-file').hidden = mode!=='file'; $('#w-link').hidden = mode!=='link'; });

    if(isDisc){ base.regNo = val('f-regno'); base.regDate = val('f-regdate'); base.brandId = brandId; }
    else { base.category = val('f-cat'); base.brandId = dlg.querySelector('#f-common').checked ? COMMON : (a && a.brandId!==COMMON ? a.brandId : brandId); }
    if(a){
      if(a.link){ const l = val('f-link'); if(!/^https?:\/\//i.test(l)){ toast('http:// 또는 https://로 시작하는 주소를 입력하세요.'); return; } base.link = l; }
      if(await guard(() => S.db.doc('attachments/'+a.id).update(base), '저장했습니다.')) closeDlg();
      return;
    }
    if(mode==='link'){
      const l = val('f-link'); if(!/^https?:\/\//i.test(l)){ toast('http:// 또는 https://로 시작하는 주소를 입력하세요.'); return; }
      if(await guard(() => S.db.collection('attachments').doc().set({...base, link:l, assetId:null, createdAt: base.updatedAt}), '등록했습니다.')) closeDlg();

      const m = {too_large:'파일이 너무 큽니다.', unsupported_type:'지원하지 않는 파일 형식입니다.', quota_or_state:'저장 공간이 부족합니다.', rate_limited:'잠시 후 다시 시도하세요.', invalid_request:'파일을 읽을 수 없습니다. 텍스트 파일은 UTF-8로 저장해 주세요.'}[e?.code] || '파일을 올리지 못했습니다.';
      toast(m); console.error(e); return; }
    const ok = await guard(() => S.db.collection('attachments').doc().set({...base, assetId: up.id, fileName: f.name, size: up.sizeBytes, contentType: up.contentType, link:null, createdAt: base.updatedAt}), '등록했습니다.');
    if(ok) closeDlg(); else { btn.disabled=false; btn.textContent='등록'; }

    await guard(async () => { if(a.assetId && S.assets){ try{ await S.assets.delete(a.assetId); }catch(e){ console.warn(e); } } await S.db.doc('attachments/'+a.id).delete(); }, '삭제했습니다.');

async function viewDoc(a){
  let src; try{ src = await fileUrl(a.assetId); }catch(e){ toast('파일을 불러오지 못했습니다.'); return; }
  const t = a.contentType || '';
  let body;
  if(t.includes('pdf')) body = `<iframe class="viewer" src="${esc(src)}" title="${esc(a.title)}"></iframe>`;
  else if(t.startsWith('image/')) body = `<img class="viewer-img" src="${esc(src)}" alt="${esc(a.title)}">`;
  else if(/^text\/|json/.test(t)) body = `<pre class="viewer-text" id="txt">불러오는 중…</pre>`;
  else body = '<div class="empty"><p>이 형식은 미리보기를 지원하지 않습니다.</p><p class="hint">내려받기를 눌러 확인하세요.</p></div>';
  openDlg(`<div class="dlg-head"><h3>${esc(a.title)}</h3>${S.downloads?`<button class="btn sm" id="v-dl">내려받기</button>`:''}<button class="btn sm" id="v-close">닫기</button></div><div class="dlg-body">${body}</div>`, true);
  $('#v-close').onclick = closeDlg;
  if(S.downloads) $('#v-dl').onclick = () => downloadDoc(a);
  if(/^text\/|json/.test(t)){
    try{ const r = await fetch(src); $('#txt').textContent = r.ok ? await r.text() : '파일을 불러오지 못했습니다.'; }
    catch(e){ $('#txt').textContent = '파일을 불러오지 못했습니다.'; }
  }
}
async function downloadDoc(a){
  try{ const r = await fetch(await fileUrl(a.assetId)); if(!r.ok) throw new Error('fetch'); const blob = await r.blob();
    await S.downloads.save({filename: a.fileName || (a.title+'.pdf'), data: blob}); }
  catch(e){ if(e?.code !== 'cancelled') toast('내려받지 못했습니다.'); console.warn(e); }
}
async function exportCsv(b){
  const head = ['품목명','분류','공급업체','공급방식','규격','단위','매입가','공급가','마진','마진율(%)','알림기준(%)','상태','점포당월구입량','점포당월마진','지정일','지정해제일','지정사유','공급가격결정기준','메모'];
  const rows = S.items.filter(i=>i.brandId===b.id).map(i => { const c=calc(i,b); return [i.name,i.category,i.supplier,i.supplyMethod,i.spec,i.unit,i.cost,i.supply,c.m,isFinite(c.rate)?c.rate.toFixed(2):'',c.th,i.releasedAt?'지정해제':({over:'기준초과',near:'기준근접',ok:'정상'}[c.status]||''),i.qty,c.monthly,i.designatedAt,i.releasedAt,i.reason,i.basis,i.note]; });
  const csv = '\uFEFF' + [head, ...rows].map(r => r.map(v => { const s=String(v??''); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }).join(',')).join('\r\n');
  try{ await S.downloads.save({filename:`${b.name}_필수품목_${today()}.csv`, data: new Blob([csv], {type:'text/csv'})}); }
  catch(e){ if(e?.code!=='cancelled') toast('내보내지 못했습니다.'); }
}

  if(el.dataset.tab){ S.tab = el.dataset.tab; render(); return; }

/* ---------- Supabase 연결 ----------
   config.js 의 APP_CONFIG 값(주소, anon 키)으로 연결합니다.
   화면 코드는 S.db / S.assets / S.downloads 만 사용하므로, 아래 어댑터가 Supabase와 화면을 이어줍니다. */
const CFG = window.APP_CONFIG || {};
const BUCKET = 'attachments';
let sb = null;
const TABLES = ['brands','items','attachments'];
const KEYMAP = {order:'sort_order', assetId:'file_path', no:'item_no'};
const REV = Object.fromEntries(Object.entries(KEYMAP).map(([a,b]) => [b,a]));
const DATE_COLS = ['designated_at','released_at','reg_date'];
const toSnake = k => KEYMAP[k] || k.replace(/[A-Z]/g, m => '_' + m.toLowerCase());
const toCamel = k => REV[k] || k.replace(/_([a-z])/g, (_, c) => c.toUpperCase());
function toRow(d){ const r = {}; for(const [k,v] of Object.entries(d)){ if(k==='id' || v===undefined) continue; const sk = toSnake(k); r[sk] = (DATE_COLS.includes(sk) && v==='') ? null : v; } return r; }
function fromRow(r){ const d = {}; for(const [k,v] of Object.entries(r)){ d[toCamel(k)] = (DATE_COLS.includes(k) && v===null) ? '' : v; } return d; }
function dbErr(e){ const x = new Error(e.message || 'error'); x.code = (e.code==='42501' || e.code==='PGRST301') ? 'invalid_argument' : (e.code || 'unknown'); return x; }
const listeners = {};
async function load(t){
  const {data, error} = await sb.from(t).select('*');
  if(error){ (listeners[t]||[]).forEach(l => l.err && l.err(error)); return; }
  const snap = {docs: data.map(r => ({id:r.id, data:() => fromRow(r)}))};
  (listeners[t]||[]).forEach(l => l.cb(snap));
}
let reloadTimer; function reloadAll(){ clearTimeout(reloadTimer); reloadTimer = setTimeout(() => TABLES.forEach(load), 150); }
function ref(t, id){ return { id,
  set: async d => { const {error} = await sb.from(t).upsert({id, ...toRow(d)}); if(error) throw dbErr(error); reloadAll(); },
  update: async d => { const {error} = await sb.from(t).update(toRow(d)).eq('id', id); if(error) throw dbErr(error); reloadAll(); },
  delete: async () => { const {error} = await sb.from(t).delete().eq('id', id); if(error) throw dbErr(error); reloadAll(); } }; }
const dbAdapter = {
  collection: t => ({ doc: id => ref(t, id || crypto.randomUUID()), onSnapshot: (cb, err) => { (listeners[t] ||= []).push({cb, err}); load(t); } }),
  doc: p => { const [t, id] = p.split('/'); return ref(t, id); }
};
const assetsAdapter = {
  upload: async (file, {type}) => {
    const ext = (file.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '') || 'bin';
    const path = `${crypto.randomUUID()}.${ext}`;
    const {error} = await sb.storage.from(BUCKET).upload(path, file, {contentType:type, upsert:false});
    if(error){ const x = new Error(error.message); x.code = /size|large/i.test(error.message) ? 'too_large' : 'upload_failed'; throw x; }
    return {id:path, sizeBytes:file.size, contentType:type};
  },
  delete: async id => { await sb.storage.from(BUCKET).remove([id]); }
};
async function fileUrl(path){ const {data, error} = await sb.storage.from(BUCKET).createSignedUrl(path, 600); if(error) throw error; return data.signedUrl; }
const downloadsAdapter = { save: async ({filename, data}) => {
  const u = URL.createObjectURL(data); const a = document.createElement('a'); a.href = u; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1500); } };

/* ---------- 로그인 ---------- */
function renderLogin(msg){
  document.body.classList.add('logged-out');
  $('#brandNav').innerHTML = '';
  $('#main').innerHTML = `<div class="login"><h1>로그인</h1><p class="hint" style="margin:0 0 16px">관리자가 발급한 계정으로 로그인하세요.</p>
    ${msg ? `<div class="alert" role="alert"><div>${esc(msg)}</div></div>` : ''}
    <form id="loginForm"><div class="field"><label for="l-email">이메일</label><input id="l-email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="l-pw">비밀번호</label><input id="l-pw" type="password" autocomplete="current-password" required></div>
    <button class="btn primary" type="submit" style="width:100%;margin-top:6px">로그인</button></form></div>`;
  $('#loginForm').onsubmit = async e => {
    e.preventDefault(); const btn = e.target.querySelector('button'); btn.disabled = true; btn.textContent = '확인 중…';
    const {error} = await sb.auth.signInWithPassword({email: $('#l-email').value.trim(), password: $('#l-pw').value});
    if(error){
      console.error(error);
      const m = String(error.message || '');
      if(/not confirmed/i.test(m)) renderLogin('이메일 인증이 끝나지 않은 계정입니다. Supabase에서 사용자를 인증(Confirm) 처리해 주세요.');
      else if(/invalid login credentials/i.test(m)) renderLogin('이메일 또는 비밀번호가 맞지 않습니다.');
      else renderLogin('로그인 실패: ' + m);
    }
  };
}
let started = false;
function startApp(session){
  document.body.classList.remove('logged-out');
  $('#userEmail').textContent = session.user?.email || '';
  if(started){ reloadAll(); return; }
  started = true;
  S.db = dbAdapter; S.assets = assetsAdapter; S.downloads = downloadsAdapter; S.canWrite = true;
  $('#main').innerHTML = '<div class="loading">데이터를 불러오는 중…</div>';
  const onErr = e => { console.error(e); toast('데이터를 불러오지 못했습니다.'); };
  S.db.collection('brands').onSnapshot(s => { S.brands = s.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(a.order??0)-(b.order??0)||String(a.name).localeCompare(String(b.name))); S.loaded.b=true; render(); }, onErr);
  S.db.collection('items').onSnapshot(s => { S.items = s.docs.map(d=>({...d.data(), id:d.id})); S.loaded.i=true; render(); }, onErr);
  S.db.collection('attachments').onSnapshot(s => { S.atts = s.docs.map(d=>({...d.data(), id:d.id})); S.loaded.a=true; render(); }, onErr);
  window.addEventListener('focus', reloadAll);
}

/* ---------- boot ---------- */
readHash(); renderNav();
$('#logoutBtn').addEventListener('click', () => sb && sb.auth.signOut());
(async () => {
  if(!window.supabase || !CFG.SUPABASE_URL || !/^https:\/\//.test(CFG.SUPABASE_URL) || !CFG.SUPABASE_ANON_KEY || /여기에/.test(CFG.SUPABASE_ANON_KEY)){
    document.body.classList.add('logged-out');
    $('#main').innerHTML = '<div class="empty"><p>Supabase 연결 정보가 없습니다.</p><p class="hint">config.js 파일에 Supabase 주소(Project URL)와 Publishable key를 넣어 주세요.</p></div>';
    return;
  }
  sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  const {data:{session}} = await sb.auth.getSession();
  if(session) startApp(session); else renderLogin();
  sb.auth.onAuthStateChange((ev, s) => { if(ev==='SIGNED_IN' && s) startApp(s); if(ev==='SIGNED_OUT') location.reload(); });
})();
})();
</script>
